name: Autopublish

# Self-publishing: every 2h a scheduled run moves one queued article from
# article-queue/ into the site's content dir and pushes it (triggers Vercel).
# PAUSED 2026-08-19. The schedule is commented out; `workflow_dispatch` still
# works, so a manual run publishes exactly as before and nothing in the queue is
# touched.
#
# Why: the generated batches are near-duplicates. On dividendengines, 1,903
# published haiku-* articles share one filler sentence ("This article provides
# valuable insights and information") in 93% of cases -- and that site's own
# sitemap.ts excludes them while blog/[id]/page.tsx serves them noindex. We are
# publishing, twelve times a day, pages we have already decided not to let Google
# see. cardclassroom has 916 more queued, 799 of them sharing a filler opener:
# about 76 days of it.
#
# Noindexed pages cannot bring traffic. They can only be read by a human browsing
# the site -- which is precisely what an affiliate network reviewer does before
# deciding on an application.
#
# Re-enable by uncommenting the schedule once the generator produces something
# worth indexing. The queue is intact and nothing here has been deleted.
on:
  # schedule:
  #   - cron: '0 */2 * * *'   # every 2 hours = 12x/day
  workflow_dispatch:
    inputs:
      count:
        description: 'articles to publish this run'
        default: '1'

permissions:
  contents: write

concurrency:
  group: autopublish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: quant/frontend/package-lock.json

      - name: Publish next article(s) from queue
        run: node scripts/queue-publish.mjs
        env:
          ARTICLES_PER_RUN: ${{ github.event.inputs.count || '1' }}

      - name: Stop early if the queue produced nothing
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to publish"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # The Next app lives in quant/frontend, not the repo root -- articles are
      # published to quant/frontend/content/blog per article-queue/.publish-config.json.
      - name: Install dependencies
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: quant/frontend
        run: npm ci

      # THE GATE. These commits trigger a Vercel deploy and the articles are
      # compiled at build time, so one malformed file breaks the entire site
      # build rather than just its own page.
      #
      # The sibling cardclassroom repo ran without this and pushed 85 articles
      # between 2026-08-12 and 2026-08-19 while every build failed on a syntax
      # error. The workflow reported success every two hours because it never
      # compiled anything, and the live site silently froze for a week.
      #
      # If the build fails the job stops here and nothing is pushed.
      - name: Build must pass before anything is pushed
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: quant/frontend
        run: npm run build

      - name: Commit & push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "autopublish[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "content: autopublish article"
          git push
